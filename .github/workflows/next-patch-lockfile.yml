name: Update Next lockfile (temporary)
on:
  push:
    branches:
      - security-next-16-3-8
    paths:
      - ".github/workflows/next-patch-lockfile.yml"
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Update Next.js and eslint config with exact versions
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev eslint-config-next@16.3.8
      - name: Commit regenerated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "security(deps): update Next.js to 16.3.8"
          git push origin HEAD:security-next-16-3-8
