name: Unpack uploaded project

on:
  push:
    paths:
      - 'Denty-Web-Vercel-Preview-1.7.1-access-fix.zip'
      - '.github/workflows/unpack-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project zip
        run: |
          set -e
          unzip -o Denty-Web-Vercel-Preview-1.7.1-access-fix.zip -d .
          rm -f Denty-Web-Vercel-Preview-1.7.1-access-fix.zip
          rm -f .github/workflows/unpack-zip.yml
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Denty web project"
            git push
          fi
