name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denty-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run verified Denty pipeline
        working-directory: apps/web
        run: node scripts/pipeline/run.mjs ci

      - name: Preserve pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denty-v3-pipeline-evidence
          path: apps/web/.artifacts/pipeline/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve generated lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denty-v3-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve domain coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denty-v3-domain-coverage
          path: apps/web/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denty-v3-playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified Vercel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DENTY-V3-VERCEL-VERIFIED
          path: apps/web/.artifacts/DENTY-V3-VERCEL-VERIFIED.zip
          if-no-files-found: error
          retention-days: 14
