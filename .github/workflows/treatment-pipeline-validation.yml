name: Denty treatment pipeline validation
on:
  push:
    branches:
      - pipeline-postmerge-hardening
      - feature/visual-personalization-palettes
      - main
      - security-confirmation-explicit-click
  pull_request:
    paths:
      - "src/shared/clinical/**"
      - "src/domain/visual-personalization.ts"
      - "src/shared/ui/visual-preferences-provider.tsx"
      - "src/shared/ui/__tests__/visual-preferences-provider.test.tsx"
      - "src/features/parity/modules/visual-personalization-*"
      - "src/features/parity/modules/settings-module.tsx"
      - "src/app/providers.tsx"
      - "src/app/layout.tsx"
      - "src/app/_components/shell/**"
      - "src/styles/**"
      - "src/shared/motion/**"
      - "src/features/dashboard/**"
      - "src/features/parity/admin-page.tsx"
      - "package.json"
      - "package-lock.json"
      - "src/app/confirmar-cita/**"
      - "src/features/odontogram/**"
      - "src/features/patients/**"
      - "src/features/parity/modules/documents-module.tsx"
      - "src/server/denty-supabase/clinical-repository.ts"
      - "supabase/migrations/*budget*.sql"
      - "supabase/migrations/*clinic_contact*.sql"
      - "scripts/tests/clinical-consent-gate-regression.mjs"
      - ".github/workflows/treatment-pipeline-validation.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  treatment-pipeline:
    name: TypeScript and clinical flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Typecheck
        run: npm run -s typecheck
      - name: Pipeline regression
        run: node scripts/tests/clinical-consent-gate-regression.mjs
      - name: Focused tests
        run: npx vitest run src/shared/clinical/__tests__/clinical-workspace.test.tsx src/shared/clinical/__tests__/deferred-budget-follow-up.test.tsx src/server/denty-supabase/__tests__/scoped-budgets.test.ts src/shared/clinical/__tests__/budget-options.test.tsx
      - name: Dashboard and admin navigation tests
        run: npx vitest run src/features/dashboard/__tests__/dashboard-calendar.test.tsx src/features/parity/__tests__/admin-home-navigation.test.tsx
      - name: Confirmation security tests
        run: npx vitest run "src/app/confirmar-cita/[token]/confirmation-action.test.ts"
      - name: Contact permissions tests
        run: npx vitest run src/app/api/clinic-contacts/route.test.ts src/features/admin/clinic-contacts/__tests__/clinic-contacts-list.test.tsx
      - name: Visual preferences and palette contract
        run: npx vitest run src/domain/__tests__/visual-personalization.test.ts src/shared/ui/__tests__/visual-preferences-provider.test.tsx
      - name: Vercel architecture gate
        run: npm run -s architecture:check
      - name: Production build smoke test
        env:
          SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          SUPABASE_PUBLISHABLE_KEY: e2e-publishable
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-publishable
        run: |
          rm -f tsconfig.tsbuildinfo
          node scripts/pipeline/run.mjs vercel-build
