name: Denty treatment pipeline validation
on:
  push:
    branches:
      - pipeline-postmerge-hardening
      - feature/visual-personalization-palettes
      - fix/wallpapers-faithful-svg-assets
      - feat/single-unified-odontogram-workbench
      - feat/odontogram-single-canvas-workspace
      - feat/sidebar-mini-week-agenda
      - fix/agenda-toothbrush-prophylaxis-icon
      - main
      - security-confirmation-explicit-click
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  treatment-pipeline:
    name: TypeScript and clinical flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Architecture gate (all files, all violations)
        run: node scripts/verify-architecture.mjs
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Typecheck
        run: npm run -s typecheck
      - name: Cephalometry native editor architecture regression
        run: node scripts/tests/cephalometry-frame-route.mjs
      - name: Pipeline regression
        run: node scripts/tests/clinical-consent-gate-regression.mjs
      - name: Focused tests
        run: npx vitest run src/shared/clinical/__tests__/clinical-workspace.test.tsx src/shared/clinical/__tests__/deferred-budget-follow-up.test.tsx src/server/denty-supabase/__tests__/scoped-budgets.test.ts src/shared/clinical/__tests__/budget-options.test.tsx src/shared/clinical/budget-comparison.test.ts src/shared/clinical/patient-budget-comparison-page.test.tsx
      - name: Recovery worklist safety and eligibility
        run: npx vitest run src/domain/__tests__/recovery-worklist.test.ts
      - name: Marketing message templates and consent checks
        run: npx vitest run src/domain/__tests__/marketing-message-templates.test.ts src/domain/__tests__/marketing-audience-safety.test.ts
      - name: Debt acknowledgement and signed print tests
        run: npx vitest run src/server/documents/document-repository.debt.test.ts src/shared/documents/document-print.test.ts
      - name: Quality integration and dental diagnosis tests
        run: >-
          npx vitest run
          src/server/denty-supabase/__tests__/quality-repository.test.ts
          src/domain/__tests__/verified-attendance.test.ts
          src/domain/__tests__/doctor-invoice-attribution.test.ts
          src/domain/__tests__/implant-surgery-reason.test.ts
          src/features/odontogram/cephalometry-editor.test.tsx
      - name: Patient record-number regression tests
        run: npx vitest run src/server/denty-supabase/__tests__/record-number.test.ts src/app/api/denty
      - name: Draft budget SQL deletion and RLS privilege tests
        run: npx vitest run src/server/denty-supabase/__tests__/draft-budget-migration.test.ts
      - name: Dashboard and admin navigation tests
        run: npx vitest run src/features/dashboard/__tests__/dashboard-calendar.test.tsx src/features/parity/__tests__/admin-home-navigation.test.tsx
      - name: Interactive sidebar mini agenda tests
        run: npx vitest run src/app/_components/shell/__tests__/sidebar-week-agenda.test.tsx
      - name: Confirmation security tests
        run: npx vitest run "src/app/confirmar-cita/[token]/confirmation-action.test.ts"
      - name: Contact permissions tests
        run: npx vitest run src/app/api/clinic-contacts/route.test.ts src/features/admin/clinic-contacts/__tests__/clinic-contacts-list.test.tsx
      - name: Visual preferences and palette contract
        run: npx vitest run src/domain/__tests__/visual-personalization.test.ts src/shared/ui/__tests__/visual-preferences-provider.test.tsx
      - name: Wallpaper fidelity and preview contracts
        run: node scripts/tests/wallpaper-artwork-regression.mjs
      - name: Unified odontogram layers and focus tests
        run: |
          npx vitest run src/domain/__tests__/endodontics.test.ts src/domain/odontogram/__tests__/surgery-procedures.test.ts src/domain/odontogram/__tests__/prosthesis-design.test.ts src/features/odontogram/surgery-panel.test.tsx src/features/odontogram/prosthetics-panel.test.tsx
          npx vitest run src/features/odontogram/cephalometry-editor.test.tsx src/features/odontogram/odontogram-view-state.test.ts src/features/odontogram/odontogram-layer-controls.test.tsx src/features/odontogram/fitted-mouth-canvas.test.tsx src/features/odontogram/odontogram-workspace.test.tsx src/features/odontogram/odontogram-layer-projection.test.ts src/features/odontogram/orthodontic-tooth-symbols.test.tsx src/features/odontogram/perio-hex-readings.test.tsx src/features/periodontal/__tests__/perio-chart.test.tsx src/domain/periodontal/__tests__/entry-cursor.test.ts
          node scripts/tests/single-odontogram-workbench.mjs
          node scripts/stage6-dentition-ui-contract.test.mjs
      - name: Agenda dental hygiene brush icon tests
        run: npx vitest run src/features/agenda/__tests__/agenda-appointment-card.test.tsx src/domain/__tests__/agenda-clinical-icons.test.ts
      - name: Supabase odontogram clinical persistence regression
        run: npx vitest run src/server/denty-supabase/__tests__/odontogram-persistence-torture.test.ts src/shared/odontogram/odontogram-wire.test.ts
      - name: Full Supabase repository regression suite
        run: npx vitest run src/server/denty-supabase/__tests__ src/app/api/denty
      - name: Vercel architecture gate
        run: npm run -s architecture:check
      - name: Production build smoke test
        env:
          SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          SUPABASE_PUBLISHABLE_KEY: e2e-publishable
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-publishable
        run: |
          rm -f tsconfig.tsbuildinfo
          node scripts/pipeline/run.mjs vercel-build
