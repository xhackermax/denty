<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8fb" id="dg-theme-color">
  <meta name="color-scheme" content="light dark">
  <script>
    (function(){
      const root=document.documentElement;
      const themeMeta=document.getElementById('dg-theme-color');
      const params=new URLSearchParams(location.search);
      const explicit=params.get('theme');
      const media=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      function parentTheme(){
        try {
          const value=window.parent && window.parent!==window
            ? window.parent.document.documentElement.getAttribute('data-mantine-color-scheme')
            : null;
          return value==='dark'||value==='light' ? value : null;
        } catch (_) { return null; }
      }
      function resolved(){
        if(explicit==='dark'||explicit==='light') return explicit;
        return parentTheme() || (media && media.matches ? 'dark' : 'light');
      }
      function apply(){
        const theme=resolved();
        root.dataset.theme=theme;
        root.style.colorScheme=theme;
        if(themeMeta) themeMeta.setAttribute('content', theme==='dark' ? '#030915' : '#f5f8fb');
        window.dispatchEvent(new CustomEvent('denty-theme-change',{detail:{theme}}));
      }
      apply();
      try {
        if(window.parent && window.parent!==window){
          const parentRoot=window.parent.document.documentElement;
          new MutationObserver(apply).observe(parentRoot,{attributes:true,attributeFilter:['data-mantine-color-scheme']});
        }
      } catch (_) {}
      if(media){
        if(media.addEventListener) media.addEventListener('change',apply);
        else if(media.addListener) media.addListener(apply);
      }
    })();
  </script>
  <title>Denty Games</title>
  <link rel="stylesheet" href="./denty-games.tokens.css?v=111">
  <link rel="stylesheet" href="./styles.css?v=111">
</head>
<body>
  <div id="app" class="app-root" aria-live="polite"></div>

  <script src="./js/core/shared.js?v=111"></script>
  <script src="./js/core/server-session.js?v=111"></script>
  <script src="./js/games/snake.js?v=111"></script>
  <script src="./js/games/block-drop.js?v=111"></script>
  <script src="./js/games/denty-run.js?v=111"></script>
  <script src="./js/games/memory.js?v=111"></script>
  <script src="./js/games/merge.js?v=111"></script>
  <script src="./js/games/air-hockey.js?v=111"></script>
  <script src="./js/games/denty-impossible.js?v=111"></script>
  <script src="./js/games/tic-tac-toe.js?v=111"></script>
  <script src="./js/games/mini-golf.js?v=111"></script>
  <script src="./js/games/breakout-dental.js?v=111"></script>
  <script src="./js/games/whack-cavity.js?v=111"></script>
  <script src="./js/games/connect-puzzle.js?v=111"></script>
  <script src="./js/games/endless-road.js?v=111"></script>
  <script src="./js/app.js?v=111"></script>
</body>
</html>
